<div class="login-form-group">
    <label for="{{ field.id_for_label }}" class="login-form-label">{{ field.label }}</label>
    <div class="login-input-group">
        <i class="bi {{ icon }} input-icon"></i>
        {{ field }}
    </div>
    {% if field.help_text %}
        <div class="small text-muted mt-1">{{ field.help_text }}</div>
    {% endif %}
    {% for error in field.errors %}
        <div class="small text-danger mt-1">{{ error }}</div>
    {% endfor %}
</div>
